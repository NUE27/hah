<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JOELL AI</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="logo.png">
</head>
<body>
  <div id="app">
    <header>
      <img src="logo.png" alt="JOELL AI" id="logo">
      <h1>JOELL AI</h1>
      <p>Tanpa filter. Tanpa batas.</p>
    </header>
    <main>
      <div id="chat-container">
        <div id="messages"></div>
        <div id="input-area">
          <input type="text" id="prompt-input" placeholder="Tanya apapun...">
          <button id="send-btn">Kirim</button>
        </div>
      </div>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
